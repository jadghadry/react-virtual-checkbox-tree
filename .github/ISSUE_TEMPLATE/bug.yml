name: Bug report
description: Something behaves differently from how it's documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        A minimal snippet — the `data` you passed and the sequence of interactions.
        A StackBlitz or CodeSandbox link is ideal, but a paste-able snippet is fine.
      render: tsx
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: react-virtual-checkbox-tree@0.2.0, react@19.3.0, next@16.3.4
    validations:
      required: true
  - type: input
    id: nodes
    attributes:
      label: Roughly how many nodes?
      description: Some issues only appear at scale.
      placeholder: "~40,000"
