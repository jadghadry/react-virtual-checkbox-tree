name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run test --workspace react-virtual-checkbox-tree
      - run: npm run build --workspace react-virtual-checkbox-tree
      - run: npm run lint:package --workspace react-virtual-checkbox-tree
      - run: npm publish --workspace react-virtual-checkbox-tree
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
